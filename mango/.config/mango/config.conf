# ==============================================================================
# Placing my environment variables here and shit
# ==============================================================================
env=QT_QPA_PLATFORMTHEME,qt5ct


# More option see https://github.com
# ==============================================================================
# AUDIO CONTROL (Using PulseAudio / PipeWire)
# ==============================================================================
bind = NONE, XF86AudioRaiseVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = NONE, XF86AudioLowerVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = NONE, XF86AudioMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# ==============================================================================
# MEDIA PLAYER CONTROLS (Play/Pause, Next, Prev via playerctl)
# ==============================================================================
bind = NONE, XF86AudioPlay, spawn, playerctl play-pause
bind = NONE, XF86AudioNext, spawn, playerctl next
bind = NONE, XF86AudioPrev, spawn, playerctl previous

# ==============================================================================
# LAPTOP DISPLAY BRIGHTNESS (Requires 'brightnessctl' installed via DNF)
# ==============================================================================
bind = NONE, XF86MonBrightnessUp, spawn, brightnessctl set +5%
bind = NONE, XF86MonBrightnessDown, spawn, brightnessctl set 5%-
#
# ==============================================================================
# KILLING ANIMATIONS
# ==============================================================================
# Hard-kill the native window and surface animation loops
#animations=0
#layer_animations=0

# Force animation states to blank/none
#animation_type_open=none
#animation_type_close=none


# ==============================================================================
# Startup processes and fuckery
# ==============================================================================
# Start custom clipboard autostart script
exec_once = /home/faceyneck/scripts/mango-clipboard-autostart.sh
# Start Notification Daemon
exec_once = mako
# Start waybar
exec_once = waybar -c ~/.config/waybar/mango-config.jsonc -s ~/.config/waybar/mango-style.css
# Example: Network Manager Applet (Wi-Fi tray icon)
exec_once = nm-applet --indicator

# Example: Audio/Volume Tray applet (if you aren't using a pure keybind)
exec_once = pasystray

# Example: Bluetooth control tray icon
exec_once = blueman-applet
# Reload Waybar
bind=SUPER+SHIFT,r,spawn,sh -c "killall waybar; waybar -c ~/.config/waybar/mango-config.jsonc -s ~/.config/waybar/mango-style.css"

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=1
xkb_rules_layout=us

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
mouse_natural_scrolling=0

# Appearance (Clean Gaps, Rounding Removed Natively)
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=1
scratchpad_height_ratio=1
border_px=4
root_color=0x201b14ff
border_color=0x444444ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0xc9b890ff
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# Layout Support Tag Routing
# ==============================================================================
# DYNAMIC LAYOUT PER WORKFLOW CONTEXT (TAGS 1-5)
# ==============================================================================
# Tag 1: Web Browser -> SCROLLER (Horizontal panning canvas)
tag_rule=id:1,layout_name:scroller

# Tag 2: Spotify -> MONOCLE (Full-screen focus mode)
tag_rule=id:2,layout_name:monocle

# Tag 3: IM & Discord -> FAIR (No wasted space on low window counts!)
tag_rule=id:3,layout_name:fair


# Tag 4: E-mail & Notes -> RIGHT_TILE (Your trusted Master/Stack layout!)
tag_rule=id:4,layout_name:right_tile

# Tag 5: Gaming & Media -> DECK (Stacked card layout)
tag_rule=id:5,layout_name:deck

# Tags 6-9: Keeping standard tiles as overflow
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile
# Key Bindings
bind=SUPER+SHIFT,c,reload_config
bind=SUPER+SHIFT,e,quit
bind=SUPER+SHIFT,q,killclient

#BEGIN_KB Launchers & Terminal
bind=SUPER,d,spawn,rofi -show drun ## Application launcher (rofi)
bind=SUPER,Return,spawn,foot ## Open terminal (foot)
bind=SUPER+SHIFT,question,spawn,/home/faceyneck/scripts/mango-keybindings.sh ## Keybindings cheatsheet (DT nod)
#END_KB

bind=SUPER,period,spawn,/usr/bin/rofimoji --action copy --clipboarder wl-copy

# ------------------------------------------------------------------------------
# Rofi clipboard
# ------------------------------------------------------------------------------
# Super+V: Clipboard History via cliphist
# Super+V: Trigger your custom clipboard pipeline script
bind=SUPER,v,spawn,/home/faceyneck/scripts/mango-clipboard-rofi-menu.sh


# Launch gtklock wrapper script
bind=SUPER,l,spawn,/home/faceyneck/scripts/mango-lock.sh

# ------------------------------------------------------------------------------
# WINDOW FOCUS DIRECTIONAL CLUSTER
# ------------------------------------------------------------------------------
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# ------------------------------------------------------------------------------
# Tabs/groups
# ------------------------------------------------------------------------------
bind=SUPER+CTRL,Left,groupjoin,left
bind=SUPER+CTRL,Right,groupjoin,right
bind=SUPER+CTRL,Up,groupjoin,up
bind=SUPER+CTRL,Down,groupjoin,down

# ------------------------------------------------------------------------------
# Cycle through groups with the bracket keys
# ------------------------------------------------------------------------------
bind=SUPER,BracketRight,groupfocus,next
bind=SUPER,BracketLeft,groupfocus,prev

# ------------------------------------------------------------------------------
# Eject window from group
# ------------------------------------------------------------------------------
bind=SUPER+ALT,E,groupleave

# ------------------------------------------------------------------------------
# Toggle group bar visibility
# ------------------------------------------------------------------------------
bind=SUPER+ALT,G,togglegroupbar

# ------------------------------------------------------------------------------
# Start Monocle view in grouped mode
# ------------------------------------------------------------------------------
monocle_tab_mode=1
monocle_right_button_close=1

# ------------------------------------------------------------------------------
# MOVE/SWAP WINDOW POSITIONS
# ------------------------------------------------------------------------------
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# Window Geometry Rules
bind=SUPER,g,toggleglobal
bind=SUPER+SHIFT,Tab,togglejump
bind=SUPER,backslash,togglefloating
bind=SUPER+SHIFT,a,togglemaximizescreen
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,f,togglefakefullscreen
bind=SUPER,i,minimized
bind=SUPER,o,toggleoverlay
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# Dynamic Tiling Layout Controls
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset
bind=SUPER,n,switch_layout

# Advanced Scroller Layout Bindings
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

# Dwindle Layout Auto-Split
bind=alt+shift,Return,dwindle_toggle_split_direction

# ==============================================================================
# WORKSPACE NAVIGATION (SUPER + 1-9)
# ==============================================================================
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Switch to tag (NumLock ON -> Fires numeric strings)
bind=SUPER,KP_1,view,1,0
bind=SUPER,KP_2,view,2,0
bind=SUPER,KP_3,view,3,0
bind=SUPER,KP_4,view,4,0
bind=SUPER,KP_5,view,5,0
bind=SUPER,KP_6,view,6,0
bind=SUPER,KP_7,view,7,0
bind=SUPER,KP_8,view,8,0
bind=SUPER,KP_9,view,9,0

# Move window to tag (NumLock ON + SHIFT -> Inverts keys to positional strings)
bind=SUPER+SHIFT,KP_End,tag,1,0
bind=SUPER+SHIFT,KP_Down,tag,2,0
bind=SUPER+SHIFT,KP_Page_Down,tag,3,0
bind=SUPER+SHIFT,KP_Left,tag,4,0
bind=SUPER+SHIFT,KP_Begin,tag,5,0
bind=SUPER+SHIFT,KP_Right,tag,6,0
bind=SUPER+SHIFT,KP_Home,tag,7,0
bind=SUPER+SHIFT,KP_Up,tag,8,0
bind=SUPER+SHIFT,KP_Page_Up,tag,9,0
bind=SUPER+SHIFT,KP_Insert,tag,10,0

# ==============================================================================
# SEND WINDOW TO WORKSPACE (SUPER + SHIFT + 1-9)
# ==============================================================================
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# ==============================================================================
# MANUALLY TOGGLE/SHARE WINDOW ON ADDITIONAL TAGS (SUPER + CTRL + 1-5)
# ==============================================================================
# This uses the dedicated 'toggletag' command to append or peel off a workspace
bind=SUPER+CTRL,1,toggletag,1
bind=SUPER+CTRL,2,toggletag,2
bind=SUPER+CTRL,3,toggletag,3
bind=SUPER+CTRL,4,toggletag,4
bind=SUPER+CTRL,5,toggletag,5



# Window Gaps Modifications
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# Absolute Tiling Adjustments
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# Manual Resize Layout Engine
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Controls
mousebind=SUPER,btn_left,moveresize,curmove
#mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Layout Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# ==============================================================================
# gammasteppy Night Light Trigger
# ==============================================================================
bind=SUPER+SHIFT,g,spawn,/home/faceyneck/scripts/gammasteppy.sh

# ==============================================================================
# Super + Shift + S: Launch Flameshot interactive screenshot tool
# ==============================================================================
bind=SUPER+SHIFT,s,spawn,/home/faceyneck/scripts/flameshot-wrapper-script.sh



# ==============================================================================
# SCRATCHPAD MANAGEMENT & FOOT TERMINAL STUFF
# ==============================================================================
window_rule=is_named_scratchpad:1,width:2200,height:1340,app_id:foot-scratch
bind=none,f12,toggle_named_scratchpad,foot-scratch,none,foot --app-id=foot-scratch

# ==============================================================================
# SECONDARY AUDIO MIXER SCRATCHPAD (wiremix)<F11>
# ==============================================================================

# --- TUI Audio Mixer Scratchpad Layout ---

# 1. Define the Window Rule (Crucial for styling and hooks)
# Tells Mango to isolate this app-id, center it, and set it as a named scratchpad
window_rule=is_named_scratchpad:1,width:1600,height:900,app_id:audiomixer

# 2. Bind the Toggle Key (Sway Muscle Memory)
# Format: bind=MOD,KEY,toggle_named_scratchpad,app_id,title,command
bind=SUPER,u,toggle_named_scratchpad,audiomixer,none,foot --app-id=audiomixer -e wiremix

# ==============================================================================
# KEEPASSXC SECURITY PASSWORD SCRATCHPAD (F1 Toggle)
# ==============================================================================
# 1. Define the Window Rule (Isolates KeePassXC by its app_id and sizes it nicely)
window_rule=is_named_scratchpad:3,width:1600,height:900,app_id:keepassxc

# 2. Bind the Toggle Key (F1 fires the scratchpad natively)
# Format: bind=MOD,KEY,toggle_named_scratchpad,id,title,command
bind=none,f1,toggle_named_scratchpad,keepassxc,none,keepassxc

# ==============================================================================
# DESKTOP HDR PIPELINE TRIGGER
# ==============================================================================
bind=SUPER+ALT,b,spawn,mmsg dispatch togglehdr


# ==============================================================================
# Adding a window rule for my key bindings cheat sheet YAD
# ==============================================================================
window_rule=is_floating:1,app_id:yad
